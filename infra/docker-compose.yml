services:
  postgres:
    image: postgres:16
    container_name: adaptlearn-postgres
    environment:
      POSTGRES_DB: adaptlearn
      POSTGRES_USER: adaptlearn
      POSTGRES_PASSWORD: adaptlearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: adaptlearn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: adaptlearn-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
